# Railway deployment configuration

[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --recursive build"

[deploy]
startCommand = "pnpm --filter @mnemonics/api start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

[[services]]
name = "mnemonics-api"

[[services.env]]
key = "NODE_ENV"
value = "production"

[[services.env]]
key = "PORT"
value = "4000"

# Add these via Railway dashboard:
# DATABASE_URL (with pgvector)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# OPENAI_API_KEY

[databases]
[[databases.service]]
name = "mnemonics-db"
image = "pgvector/pgvector:pg16"
