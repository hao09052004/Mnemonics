<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ảnh gốc - Mnemonics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #202124; }
  body { min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; color: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; background: #111214; border-bottom: 1px solid #34363a; }
  #title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  #download { color: #fff; background: #5b3fe4; border-radius: 7px; padding: 9px 12px; text-decoration: none; font-size: 13px; font-weight: 700; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
  #image { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; display: block; background: #fff; }
  #status { color: #c8c9cc; text-align: center; }
</style>
</head>
<body>
<header><div id="title">Ảnh gốc</div><a id="download" download="mnemonics-image">Tải ảnh</a></header>
<main><img id="image" alt="Ảnh gốc" hidden><div id="status">Đang tải ảnh...</div></main>
<script src="original-image.js"></script>
</body>
</html>
